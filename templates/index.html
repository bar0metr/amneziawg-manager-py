<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>(A)WG Manager</title>
    <link rel="stylesheet" href="/static/main.css">
</head>
<body>
<h1><div id="managerName"></div></h1>
<div id="backendStatus" style="padding:6px; margin-bottom:10px; font-weight:bold; text-align:center;">
  Checking backend...
</div>

<section>
  <h2>Preview next peer (ready, but NOT added!)</h2>
  <div id="previewBox">
    <textarea id="clientConfig" readonly rows="14" cols="90"></textarea>
    <div id="previewButtons">
      <button id="addPeerBtn">Add Peer (apply)</button>
      <button id="copyConfigBtn">Copy</button>
      <button id="downloadConfigBtn">Download</button>
    </div>
    <div id="qrBox">
      <h3>QR (contains full client config)</h3>
      <img id="qrImage" alt="QR will appear here">
    </div>
  </div>
</section>

<hr>

<section>
  <h2>Peers</h2>
  <table id="peersTable" border="1">
    <thead>
      <tr>
        <th>PubKey</th>
        <th>Allowed IP</th>
        <th>Endpoint</th>
        <th>Handshake</th>
        <th>Transfer</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<script src="/static/main.js"></script>
</body>
</html>
